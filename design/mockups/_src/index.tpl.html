<!doctype html>
<html lang="__HTMLLANG__" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__IDXTITLE__</title>
<link rel="icon" href="data:,">
<style>
__CSS__
body{padding:0 0 60px}
.wrap{max-width:1500px;margin:0 auto;padding:0 24px}
header.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;padding:22px 0 10px}
header.top h1{margin:0;font:400 30px/1.1 var(--f-title);letter-spacing:.02em;display:flex;gap:12px;align-items:center}
header.top h1 .wordmark{font-size:30px}
header.top p{margin:6px 0 0;color:var(--page-ink2);font-size:15px;max-width:640px}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:14px;color:var(--page-ink2)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);font-weight:600;padding:12px 18px;border-radius:14px;text-decoration:none;border-bottom:3px solid var(--primary-lip)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px;position:sticky;top:0;z-index:20;background:var(--page);padding:10px 0;border-bottom:1px solid var(--line)}
.flow a{color:var(--page-ink);text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--page-card);border:1px solid var(--line)}
.flow a:hover{border-color:var(--primary)}
.flow i{font-style:normal;color:var(--page-ink2)}
#groups{display:flex;flex-wrap:wrap;gap:34px 56px;align-items:flex-start;margin-top:26px}
section.grp{scroll-margin-top:70px}
section.grp>h2{margin:0 0 4px;font:400 24px var(--f-title);display:flex;gap:10px;align-items:baseline}
section.grp>h2 span{font:500 14px var(--f-text);text-transform:none;color:var(--page-ink2)}
.row{display:flex;flex-wrap:wrap;gap:22px 28px;margin-top:14px}
figure{margin:0;width:__W__px}
.ph{width:__W__px;height:__H__px;position:relative;border-radius:calc(66px*__S__)}
.ph iframe{position:absolute;left:0;top:0;width:414px;height:868px;border:0;transform:scale(__S__);transform-origin:top left;background:transparent;color-scheme:normal}
figcaption{margin-top:10px;font-size:14px;line-height:1.35;color:var(--page-ink2)}
figcaption b{display:block;color:var(--page-ink);font-size:15px}
figcaption a{color:var(--primary);font-weight:600;text-decoration:none;white-space:nowrap}
figcaption a:hover{text-decoration:underline}
.legend2{font-size:13px;color:var(--page-ink2);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><h1><span id="logo"></span><span id="h1"></span></h1>
  <p id="intro"></p></div>
  <div class="ctrls">
    <span><span class="tb-label" id="l-mode"></span><span class="seg"><button data-theme-btn="light" id="b-light"></button><button data-theme-btn="dark" id="b-dark"></button></span></span>
    <label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="rm"> <span id="l-rm"></span></label>
    <span class="seg"><button aria-pressed="true" disabled id="lang-here"></button><a class="langsw" id="lang-sw"></a></span>
    <a class="cta" id="proto" href="prototype.html"></a>
  </div>
</header>
<nav class="flow" id="flow"></nav>
<div id="groups"></div>
</div>
<script>
window.ESP_LANG = '__LANG__';
__STRINGS__
</script>
<script>
__MASCOT__
</script>
<script>
(function(){
  var SCREENS = __SCREENS__, S = __S__, T = window.ESP_T, X = T.idx, L = T.lang;
  var H = function(id, v){ document.getElementById(id).innerHTML = v; };
  H('h1', X.h1); H('intro', X.intro); H('l-mode', X.mode); H('b-light', X.light); H('b-dark', X.dark); H('l-rm', X.reduce); H('proto', X.proto); H('lang-here', T.thisLabel); H('lang-sw', T.otherLabel);
  document.getElementById('flow').setAttribute('aria-label', X.flow);
  document.getElementById('lang-sw').href = '../' + T.other + '/index.html';
  var root = document.documentElement, qs = new URLSearchParams(location.search);
  var theme = qs.get('theme'); try { theme = theme || localStorage.getItem('esp-theme'); } catch(e){}
  theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.getElementById('logo').innerHTML = Raccoon.mark(40);
  var groups = [], by = {};
  SCREENS.forEach(function(s){ var g = s.group[L]; if(!by[g]){ by[g]=[]; groups.push(g);} by[g].push(s); });
  var flow = document.getElementById('flow');
  flow.innerHTML = groups.map(function(g,i){ return '<a href="#g'+i+'">'+g+'</a>'+(i<groups.length-1?'<i>→</i>':''); }).join('');
  document.getElementById('groups').innerHTML = groups.map(function(g,i){
    return '<section class="grp" id="g'+i+'"><h2>'+g+'<span>'+by[g].length+(by[g].length>1?X.states:X.state)+'</span></h2><div class="row">'+by[g].map(function(s){
      return '<figure><div class="ph"><iframe loading="lazy" title="'+s.title[L]+'" data-file="'+s.file+'"></iframe></div><figcaption><b>'+s.title[L]+'</b>'+s.desc[L]+' <a href="'+s.file+'" data-open>'+X.open+'</a></figcaption></figure>';
    }).join('')+'</div></section>';
  }).join('');
  function frames(){ return document.querySelectorAll('iframe'); }
  function setTheme(t){
    theme = t; root.dataset.theme = t; try{localStorage.setItem('esp-theme',t);}catch(e){}
    document.querySelectorAll('[data-theme-btn]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.themeBtn===t); });
    frames().forEach(function(f){ try{ f.contentWindow.postMessage({esp:'theme',v:t},'*'); }catch(e){} });
    document.querySelectorAll('a[href]').forEach(function(a){ if(/\.html/.test(a.getAttribute('href'))){ a.href = a.getAttribute('href').split('?')[0]+'?theme='+t; } });
  }
  frames().forEach(function(f){
    f.src = f.dataset.file+'?embed=1&theme='+theme;
    f.addEventListener('load', function(){ try{ f.contentWindow.postMessage({esp:'theme',v:theme},'*'); f.contentWindow.postMessage({esp:'reduce',v:document.getElementById('rm').checked},'*'); }catch(e){} });
  });
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){ b.onclick=function(){ setTheme(b.dataset.themeBtn); }; });
  document.getElementById('rm').onchange=function(e){ root.dataset.reduce = e.target.checked?'1':'0'; frames().forEach(function(f){ try{ f.contentWindow.postMessage({esp:'reduce',v:e.target.checked},'*'); }catch(x){} }); };
  setTheme(theme);
})();
</script>
</body>
</html>
