<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esplitéalo · screen designs</title>
<link rel="icon" href="data:,">
<style>
/* Esplitéalo HTML mockups — tokens from docs/DESIGN_GUIDE.md */
@font-face{font-family:"Unkempt";font-style:normal;font-weight:400;font-display:swap;src:url(../_src/fonts/Unkempt-Regular-latin.woff2) format("woff2")}
@font-face{font-family:"Unkempt";font-style:normal;font-weight:700;font-display:swap;src:url(../_src/fonts/Unkempt-Bold-latin.woff2) format("woff2")}
:root{
  --paper:#FBF7EF; --surface:#FFFFFF; --well:#F1EADB; --ink:#1E2933; --ink2:#5B6670;
  --line:#DDD3BE; --primary:#1F7A5A; --primary-lip:#145A42; --on-primary:#FFFFFF;
  --accent:#F2B84B; --warn:#C23A1D; --warn-bg:#FBEAE4; --ok-bg:#E3F1EA;
  --scrim:rgba(20,24,28,.46); --shadow:0 1px 2px rgba(30,41,51,.08),0 6px 18px rgba(30,41,51,.07);
  --p1:#2F6FA8; --p2:#A85A14; --p3:#7A4FB5; --p4:#1B7F72; --p5:#C23D7B; --p6:#58781C; --p7:#8A6D00; --p8:#5B6B80;
  --on-p:#FFFFFF;
  --page:#E8E2D4; --page-ink:#1E2933; --page-ink2:#5B6670; --page-card:#F6F2E8;
  --f-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-title:"Unkempt","Marker Felt","Chalkboard SE",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --paper:#14181C; --surface:#1E252B; --well:#28313A; --ink:#F2EEE6; --ink2:#A5AEB6;
  --line:#36414B; --primary:#4CC59A; --primary-lip:#2E9C77; --on-primary:#0E1F18;
  --accent:#F5C766; --warn:#FF8466; --warn-bg:#3A2420; --ok-bg:#1B3029;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --p1:#6FA8DC; --p2:#E39B52; --p3:#B79AE0; --p4:#55C2B2; --p5:#E67FB0; --p6:#A5C55A; --p7:#E8C85A; --p8:#9AA8BA;
  --on-p:#14181C;
  --page:#0B0D10; --page-ink:#F2EEE6; --page-ink2:#A5AEB6; --page-card:#171C21;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--page-ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}

/* ---------- page chrome (outside the phone) ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;padding:12px 16px;font-size:14px;color:var(--page-ink2)}
.toolbar a{color:var(--page-ink);text-decoration:none;font-weight:600}
.toolbar a:hover{text-decoration:underline}
.toolbar .ttl{color:var(--page-ink);font-weight:600}
.seg{display:inline-flex;background:var(--page-card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--page-ink2)}
.seg button[aria-pressed="true"]{background:var(--page-ink);color:var(--page)}
.tb-label{font-size:12px;margin-right:6px}
.haptic{min-width:170px;font-family:var(--f-mono);font-size:12px;opacity:0;transition:opacity .2s;color:var(--page-ink)}
.haptic.on{opacity:1}
.stage{display:flex;justify-content:center;padding:4px 0 28px}
.fit{transform-origin:top center}

/* ---------- device ---------- */
.device{width:414px;height:868px;padding:12px;border-radius:66px;background:#0B0C0E;box-shadow:0 0 0 2px #2b2e33,0 24px 60px rgba(0,0,0,.35);position:relative}
.screen{width:390px;height:844px;border-radius:54px;overflow:hidden;position:relative;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.3;isolation:isolate}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:54px;padding:18px 34px 0 40px;display:flex;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:16px;z-index:50;pointer-events:none;font-family:var(--f-text)}
.status svg{display:block;fill:currentColor}
.status .ic{display:flex;gap:6px;align-items:center;margin-top:3px}
.home-ind{position:absolute;bottom:8px;left:50%;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:var(--ink);opacity:.85;z-index:55;pointer-events:none}
.dark-chrome .status,.dark-chrome .home-ind{color:#fff}
.dark-chrome .home-ind{background:#fff}

.view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:54px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.footer{padding:12px 16px 34px;background:linear-gradient(to top,var(--paper) 78%,transparent);position:relative;z-index:3;display:flex;flex-direction:column;gap:8px}
.footer.bar{background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.04)}

/* ---------- type ---------- */
.t-display{font:600 40px/1.05 var(--f-round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t-title{font:400 26px/1.2 var(--f-title);letter-spacing:.01em}
.wordmark{font:700 24px/1 var(--f-title);letter-spacing:.02em;text-transform:uppercase;font-synthesis:none}
.t-amount{font:500 22px/1.15 var(--f-round);font-variant-numeric:tabular-nums}
.t-head{font-weight:600;font-size:17px}
.t-body{font-size:17px}
.t-sub{font-size:15px;color:var(--ink2)}
.t-foot{font-size:13px;color:var(--ink2);line-height:1.35}
.t-cap{font-size:12px;font-weight:500;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.warn-t{color:var(--warn)}
.ok-t{color:var(--primary)}

/* ---------- nav ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 6px 0 4px;flex:none}
.back{display:flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;color:var(--primary);font-size:17px}
.back svg{width:12px;height:20px}
.step{font-size:13px;color:var(--ink2);padding-right:10px}
.head{padding:2px 16px 12px;flex:none}
.head .t-title{margin:0}
.head .t-sub{margin-top:4px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-size:17px;font-weight:600;text-align:center;transition:transform .1s,filter .1s}
.btn:active{transform:scale(.97);filter:brightness(.8)}
.btn-primary{background:var(--primary);color:var(--on-primary);border-bottom:3px solid var(--primary-lip);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.btn-secondary{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);min-height:52px}
.btn-quiet{min-height:44px;color:var(--primary);font-weight:600;font-size:17px}
.btn-warn{background:var(--surface);color:var(--warn);border:1.5px solid var(--warn);min-height:52px}
.btn[disabled],.btn.is-disabled{background:var(--well);color:var(--ink2);border:1.5px dashed var(--line);box-shadow:none;cursor:not-allowed}
.btn.is-disabled:active{transform:none;filter:none}
.btn svg{width:22px;height:22px;flex:none}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px}
.link{color:var(--primary);font-weight:600;min-height:44px;display:inline-flex;align-items:center}

/* ---------- cards, chips, avatars ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.well{background:var(--well);border-radius:16px}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font:600 14px/1 var(--f-text);color:var(--on-p);background:var(--pc,var(--p8))}
.av.lg{width:40px;height:40px;font-size:18px}
.av.xl{width:48px;height:48px;font-size:20px}
.av.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc);background-clip:padding-box}
.av.dotted{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--pc);outline:2px dotted var(--pc);outline-offset:3px}
.s1{--pc:var(--p1)}.s2{--pc:var(--p2)}.s3{--pc:var(--p3)}.s4{--pc:var(--p4)}.s5{--pc:var(--p5)}.s6{--pc:var(--p6)}.s7{--pc:var(--p7)}.s8{--pc:var(--p8)}
.av-stack{display:inline-flex}
.av-stack .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.av-stack .av:first-child{margin-left:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;line-height:1.3}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--primary)}
.pill.neutral{background:var(--well);color:var(--ink2)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- banners ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:12px 14px;border:1.5px solid}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--ink)}
.banner.ok{background:var(--ok-bg);border-color:var(--primary);color:var(--ink)}
.banner .b-ico{flex:none;width:24px;height:24px;margin-top:1px}
.banner.warn .b-ico{color:var(--warn)} .banner.ok .b-ico{color:var(--primary)}
.banner>div>b:first-child,.banner b.hd{display:block;font-size:17px;font-weight:600}
.banner .t-foot{color:var(--ink2);margin-top:2px}
.banner .rc-wrap{flex:none;margin:-6px -4px -6px 0}

/* ---------- meter ---------- */
.meter{height:22px;border-radius:11px;background:var(--well);border:1.5px solid var(--line);padding:4px;display:block}
.meter i{display:block;height:100%;border-radius:7px;background:var(--primary);min-width:0;transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.meter.done{border-color:var(--primary)}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fadein .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px 34px;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sheetup .3s cubic-bezier(.2,.9,.3,1) both;max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet.still{animation:none}
.sheet::-webkit-scrollbar{display:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0;font:600 22px/1.2 var(--f-round)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink2);font-weight:500}
.input{height:52px;border-radius:12px;background:var(--well);border:1.5px solid transparent;padding:0 14px;font-size:17px;width:100%;outline:none}
.input:focus{border-color:var(--primary);background:var(--surface)}
.input.err{border-color:var(--warn)}
.input.amt{font:500 22px var(--f-round);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- generic list rows ---------- */
.group-label{font-size:13px;font-weight:600;color:var(--ink2);margin:18px 4px 8px}

/* ---------- toast ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:120px;z-index:40;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px;font-size:15px;box-shadow:var(--shadow);animation:sheetup .25s ease both}

/* ---------- reduced motion ---------- */
:root[data-reduce="1"] *,:root[data-reduce="1"] *::before,:root[data-reduce="1"] *::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}

/* ---------- mascot motion ---------- */
.rc,.scene{display:block;overflow:visible}
.rc .pupil,.scene .pupil{transition:transform .3s}
@keyframes lookaround{0%,100%{transform:translateX(0)}30%{transform:translateX(5px)}65%{transform:translateX(-5px)}}
.look-around .pupil{animation:lookaround 2.6s ease-in-out infinite}
@keyframes glass{0%,100%{transform:translate(110px,176px)}50%{transform:translate(190px,176px)}}
.scene .glass{animation:glass 2.6s ease-in-out infinite;transform:translate(110px,176px)}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(54px)}}
.scene .scanline{animation:scan 2.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.tail-wag{transform-origin:262px 150px;animation:wag 3s ease-in-out infinite}
@keyframes conf{0%{transform-box:fill-box;opacity:0;translate:0 -14px}20%{opacity:1}100%{opacity:1;translate:0 10px}}
.conf{animation:conf 1.1s ease-out both;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.rc-neutral .eyes,.rc-thinking .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

/* ======================= screens ======================= */
body.embed{background:transparent}
body.embed .stage{padding:0}
.fadein{animation:fadein .3s ease both}
.rc-wrap{flex:none}
.rbill{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:62px;padding:8px 16px}
.rbill:active{background:var(--well)}

/* capture */
.vf{position:absolute;inset:0;background:#15110e;overflow:hidden}
.vf .table{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,#3a312a 0%,#1b1612 70%);}
.vf .table::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(95deg,rgba(255,255,255,.035) 0 2px,transparent 2px 38px)}
.vf.frozen{filter:saturate(.92) brightness(.9)}
.brk{position:absolute;width:34px;height:34px;border:4px solid #fff;border-right:0;border-bottom:0;border-radius:10px 0 0 0;opacity:.95}
.brk.r{border:4px solid #fff;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.brk.b{border:4px solid #fff;border-right:0;border-top:0;border-radius:0 0 0 10px}
.brk.br{border:4px solid #fff;border-left:0;border-top:0;border-radius:0 0 10px 0}
.cam-top{position:absolute;top:58px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;z-index:5}
.cam-btn{min-width:44px;min-height:44px;padding:0 14px;border-radius:22px;background:rgba(0,0,0,.45);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center}
.guide-pill{position:absolute;top:116px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px;align-items:center;width:max-content;max-width:344px;padding:9px 16px;border-radius:22px;text-align:left;line-height:1.25;background:rgba(255,255,255,.86);color:#1E2933;font-size:15px;font-weight:500;backdrop-filter:blur(8px)}
.guide-pill .ico{width:18px;height:18px}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 34px;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));z-index:5;display:flex;flex-direction:column}
.cam-bottom.row{flex-direction:row;align-items:center;justify-content:space-between;padding:20px 22px 40px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.shutter i{width:60px;height:60px;border-radius:50%;background:#fff;display:block}
.shutter:active{transform:scale(.94)}
.lib{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:12px;font-weight:500;min-height:44px}
.lib-th{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.6)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
.flash.go{animation:flashgo .22s ease-out}
@keyframes flashgo{0%{opacity:.9}100%{opacity:0}}

/* receipt paper */
.paper{background:#FFFDF7;color:#2a2a2a;font-family:var(--f-mono);line-height:1.5;padding:1.1em 1.2em 1.7em;border-radius:3px;box-shadow:0 8px 26px rgba(0,0,0,.35);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/1.4em 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/1.4em 100%;margin-bottom:0;position:relative}
.paper .pc{text-align:center;opacity:.82;font-size:.86em}.paper .pc.big{font-weight:700;font-size:1.1em;opacity:1;letter-spacing:.05em}
.paper .pd{border-top:1px dashed rgba(0,0,0,.4);margin:.55em 0}
.paper .pl{display:flex;justify-content:space-between;gap:.6em;white-space:nowrap}.paper .pl.b{font-weight:700}
.paper .pl.hl{background:rgba(194,58,29,.14);outline:1.5px solid #C23A1D;outline-offset:1px;border-radius:2px}

/* processing */
.ibar{width:220px;height:6px;border-radius:3px;background:var(--well);overflow:hidden;position:relative}
.ibar i{position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:var(--primary);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}

/* review */
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:8px 16px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow:active{background:var(--well)}
.rrow.flag{background:var(--warn-bg);box-shadow:inset 4px 0 0 var(--warn)}
.rr-l{display:flex;flex-direction:column;min-width:0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:8px 16px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow.bad{background:var(--warn-bg);box-shadow:inset 4px 0 0 var(--warn)}
.thumb{overflow:hidden}
.thumb-h{display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px 8px 8px;min-height:64px}
.th-mini{width:48px;height:48px;overflow:hidden;border-radius:8px;background:var(--well);display:block;position:relative;flex:none}
.th-mini .paper{position:absolute;left:-12px;top:2px;box-shadow:none}
.th-body{padding:4px 12px 14px;background:var(--well)}
.th-body .paper{box-shadow:0 4px 14px rgba(0,0,0,.2);margin-top:10px}

/* people */
.prow2{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 14px;border-top:1px solid var(--line)}
.prow2:first-child{border-top:0}
.mini{min-height:44px;padding:0 10px;font-size:15px;font-weight:600;color:var(--primary);border-radius:10px}
.mini:active{background:var(--well)}
.mini.warn-t{color:var(--warn)}

/* assign */
.chips-wrap{position:relative;z-index:25;background:var(--paper);flex:none;padding-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scroll-snap-type:x proximity;scroll-padding-left:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:124px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:14px;padding:8px 10px 8px;display:flex;flex-direction:column;gap:2px;text-align:left;transition:transform .15s,box-shadow .15s}
.chip-top{display:flex;align-items:center;gap:8px}.chip-top b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .t-amount{display:block}
.chip:active{transform:scale(.97)}
.chip.on{box-shadow:0 0 0 2.5px var(--pc);background:var(--surface)}
.pop{animation:pop .38s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.1)}100%{transform:scale(1)}}
.paintbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 16px 0;padding:2px 4px 2px 12px;border-radius:12px;background:var(--well);border-left:5px solid var(--pc);font-size:14px;position:relative;z-index:2}
.ilist{display:flex;flex-direction:column;gap:8px}
.irow{position:relative;display:flex;min-height:68px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .1s,filter .1s;outline-offset:2px}
.irow:active{transform:scale(.985);filter:brightness(.92)}
.irow .bar{display:flex;flex-direction:column;width:7px;flex:none}
.irow .bar s{flex:1;background:var(--pc);display:block}
.ir-main{flex:1;min-width:0;padding:9px 14px 9px 12px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.ir-1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ir-name{min-width:0;overflow-wrap:anywhere}
.ir-2{display:flex;align-items:center;gap:8px;min-height:28px}
.ir-2 .t-foot{white-space:nowrap}
.irow.un{background:var(--warn-bg);border:2px dashed var(--warn)}
.irow.un .ir-main{padding-left:14px}
.irow.pulse{animation:pulsew .9s ease 2}
@keyframes pulsew{0%,100%{transform:none}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.prows{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 14px 6px 10px;border-radius:14px;background:var(--well);border:2px solid transparent;transition:background .15s,border-color .15s}
.prow.on{border-color:var(--pc);background:var(--surface);box-shadow:0 0 0 1px var(--line) inset}
.prow:active{filter:brightness(.92)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-primary)}
.prow.on .ck{background:var(--primary);border-color:var(--primary)}
.ck .ico{width:16px;height:16px;stroke-width:3}
.fly{position:absolute;z-index:70;pointer-events:none;background:var(--primary);color:var(--on-primary);font:600 15px var(--f-round);padding:3px 10px;border-radius:999px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}

/* totals */
.segm{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--well);border-radius:14px;padding:4px}
.segm button{min-height:44px;border-radius:11px;font-weight:600;font-size:16px;color:var(--ink2);text-align:center}
.segm button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1.5px var(--primary)}
.sum{padding:12px 16px;margin-top:10px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.sum3 div{display:flex;flex-direction:column;gap:2px}
.sbar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;background:var(--paper)}
.sbar span{background:var(--pc);color:var(--on-p);font:600 15px/34px var(--f-text);text-align:center;transition:width .35s}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 2px 12px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%;background:var(--pc);display:block}
.cards{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:16px;overflow:hidden}
.pc-h{display:block;width:100%;padding:12px 14px 12px 12px;min-height:44px}
.pc-top{display:flex;align-items:center;gap:10px}
.pc-line{margin-top:6px}
.pc-body{padding:2px 14px 12px 14px;border-top:1px dashed var(--line);margin:0 0}
.ln{display:flex;justify-content:space-between;font-size:15px;padding:6px 0}
.round{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 12px 8px;margin-top:12px;background:var(--well);border-style:dashed}
.round li{margin:2px 0}
.doc{width:44px;height:44px;border-radius:10px;background:var(--well);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.sumtxt{margin:0 0 12px;padding:12px;background:var(--well);border-radius:12px;font:13px/1.45 var(--f-mono);white-space:pre-wrap;max-height:196px;overflow:auto;color:var(--ink)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.apps button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink2);min-height:44px}
.apps span{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.apps svg{width:28px;height:28px}
.success{position:absolute;inset:0;z-index:35;background:var(--paper);display:flex;align-items:center;justify-content:center;padding-top:54px}
.how{list-style:none;padding:0;margin:12px 0 16px;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.how li{counter-increment:s;display:flex;gap:12px;align-items:center;min-height:44px}
.how li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--ok-bg);color:var(--primary);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.how b{display:block;font-size:17px}.how span{font-size:15px;color:var(--ink2)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:70}

/* bilingual additions */
.say{position:relative;display:inline-block;max-width:300px;padding:7px 14px;border-radius:16px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font:600 14px/1.25 var(--f-round);text-align:center;box-shadow:var(--shadow)}
.say::before{content:"";position:absolute;left:50%;top:-7px;width:12px;height:12px;background:var(--surface);border-left:1.5px solid var(--line);border-top:1.5px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.seg a.langsw{display:inline-flex;align-items:center;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--page-ink);text-decoration:none}
.seg a.langsw:hover{text-decoration:underline}
.seg button[disabled]{cursor:default}

body{padding:0 0 60px}
.wrap{max-width:1500px;margin:0 auto;padding:0 24px}
header.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;padding:22px 0 10px}
header.top h1{margin:0;font:400 30px/1.1 var(--f-title);letter-spacing:.02em;display:flex;gap:12px;align-items:center}
header.top h1 .wordmark{font-size:30px}
header.top p{margin:6px 0 0;color:var(--page-ink2);font-size:15px;max-width:640px}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:14px;color:var(--page-ink2)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);font-weight:600;padding:12px 18px;border-radius:14px;text-decoration:none;border-bottom:3px solid var(--primary-lip)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px;position:sticky;top:0;z-index:20;background:var(--page);padding:10px 0;border-bottom:1px solid var(--line)}
.flow a{color:var(--page-ink);text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--page-card);border:1px solid var(--line)}
.flow a:hover{border-color:var(--primary)}
.flow i{font-style:normal;color:var(--page-ink2)}
#groups{display:flex;flex-wrap:wrap;gap:34px 56px;align-items:flex-start;margin-top:26px}
section.grp{scroll-margin-top:70px}
section.grp>h2{margin:0 0 4px;font:400 24px var(--f-title);display:flex;gap:10px;align-items:baseline}
section.grp>h2 span{font:500 14px var(--f-text);text-transform:none;color:var(--page-ink2)}
.row{display:flex;flex-wrap:wrap;gap:22px 28px;margin-top:14px}
figure{margin:0;width:248px}
.ph{width:248px;height:521px;position:relative;border-radius:calc(66px*0.6)}
.ph iframe{position:absolute;left:0;top:0;width:414px;height:868px;border:0;transform:scale(0.6);transform-origin:top left;background:transparent;color-scheme:normal}
figcaption{margin-top:10px;font-size:14px;line-height:1.35;color:var(--page-ink2)}
figcaption b{display:block;color:var(--page-ink);font-size:15px}
figcaption a{color:var(--primary);font-weight:600;text-decoration:none;white-space:nowrap}
figcaption a:hover{text-decoration:underline}
.legend2{font-size:13px;color:var(--page-ink2);margin-top:8px}
</style>
</head>

    <span><span class="tb-label" id="l-mode"></span><span class="seg"><button data-theme-btn="light" id="b-light"></button><button data-theme-btn="dark" id="b-dark"></button></span></span>

<script>

        mouth = '<path d="M87 157 Q100 145 113 157" fill="none" stroke="' + MASK + '" stroke-width="4" stroke-linecap="round"/>';
        extra = '<path d="M164 62 C171 73 173 80 164 85 C155 80 157 73 164 62Z" fill="#7FC4E8"/><ellipse cx="162" cy="78" rx="2" ry="3" fill="#fff" opacity=".7"/>';
