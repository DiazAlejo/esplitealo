name: Set up the iOS simulator
description: >-
  Selects Xcode 26.3 and picks an iPhone simulator on an iOS 18 runtime (installing the runtime when the runner image
  lacks it). CI and the Record snapshots workflow both use it, so they always render on the same simulator.

inputs:
  ios-major:
    description: Major iOS version of the simulator runtime.
    default: "18"
  runtime-build:
    description: iOS runtime build to download when the image has no runtime of that major version.
    default: "18.6"

outputs:
  udid:
    description: UDID of the simulator to pass to xcodebuild -destination.
    value: ${{ steps.simulator.outputs.udid }}

runs:
  using: composite
  steps:
    - name: Select Xcode 26.3
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
        xcodebuild -version

    # The runner image ships only the newest iOS runtime, so install iOS 18 when it is missing.
    - name: Pick an iOS ${{ inputs.ios-major }} simulator
      id: simulator
      shell: bash
      env:
        IOS_MAJOR: ${{ inputs.ios-major }}
        RUNTIME_BUILD: ${{ inputs.runtime-build }}
      run: |
        if ! Scripts/ios-simulator-udid.sh "$IOS_MAJOR" >/dev/null 2>&1; then
          xcodebuild -downloadPlatform iOS -buildVersion "$RUNTIME_BUILD"
        fi
        udid="$(Scripts/ios-simulator-udid.sh "$IOS_MAJOR")"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
        xcrun simctl list devices available | grep -F "$udid" || true
