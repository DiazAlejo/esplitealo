name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id and name stay "macOS": branch protection requires the "CI / macOS" check.
  macOS:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: swift build
        run: swift build

      - name: swift test (deterministic)
        env:
          ESPLITEALO_SKIP_VISION_INTEGRATION: "1"
        run: swift test

  ios-simulator:
    name: iOS Simulator tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: macOS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      # The runner image ships only the newest iOS runtime, so install iOS 18 when it is missing.
      - name: Pick an iOS 18 simulator
        id: simulator
        run: |
          if ! Scripts/ios-simulator-udid.sh 18 >/dev/null 2>&1; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.6
          fi
          udid="$(Scripts/ios-simulator-udid.sh 18)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run package tests on the iOS 18 simulator
        run: |
          xcodebuild test \
            -scheme EsplitealoCore-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  # The Esplitéalo app (App/Esplitealo.xcodeproj): build, unit and snapshot tests, UI smoke test.
  # Not in branch protection and gated on the required "macOS" job, so it can never make the required check slower or flakier.
  ios-app:
    name: iOS App
    runs-on: macos-26
    timeout-minutes: 40
    needs: macOS
    env:
      # Snapshot references are recorded on iOS 18.x; xcodebuild keeps its package checkouts in a cached folder.
      SOURCE_PACKAGES: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Pick an iOS 18 simulator
        id: simulator
        run: |
          if ! Scripts/ios-simulator-udid.sh 18 >/dev/null 2>&1; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.6
          fi
          udid="$(Scripts/ios-simulator-udid.sh 18)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Cache package checkouts (swift-snapshot-testing)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .spm
          key: ${{ runner.os }}-app-spm-${{ hashFiles('App/Esplitealo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build the app for the iOS Simulator (no signing)
        run: |
          xcodebuild build \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit and snapshot tests
        run: |
          xcodebuild test \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -only-testing:EsplitealoTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

      # Launching the app in a simulator is the flakiest part of any iOS CI, so a failure here is reported but does
      # not fail the job. Run it locally before merging changes to navigation.
      - name: UI smoke tests
        continue-on-error: true
        run: |
          xcodebuild test \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -only-testing:EsplitealoUITests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

  linux-core:
    name: Linux Core build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container: swift:6.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only EsplitealoCore: the other targets import Apple-only frameworks.
      - name: Build EsplitealoCore (Foundation only)
        run: swift build --target EsplitealoCore

  vision-integration:
    name: Vision integration
    runs-on: macos-26
    timeout-minutes: 45
    needs: macOS
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Vision OCR integration tests
        run: swift test --filter ReceiptScannerVisionTests

  ios-capture:
    name: iOS Capture compile
    runs-on: macos-26
    timeout-minutes: 25
    needs: macOS
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Build EsplitealoCapture for iOS Simulator
        run: |
          xcodebuild build \
            -scheme EsplitealoCapture \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Scanner Lab for generic iOS (no signing)
        run: |
          xcodebuild build \
            -project Tools/ScannerLab/ScannerLab.xcodeproj \
            -scheme ScannerLab \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
