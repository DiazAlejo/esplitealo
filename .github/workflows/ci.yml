name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id and name stay "macOS": branch protection requires the "CI / macOS" check.
  macOS:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: swift build
        run: swift build

      - name: swift test (deterministic)
        env:
          ESPLITEALO_SKIP_VISION_INTEGRATION: "1"
        run: swift test

  ios-simulator:
    name: iOS Simulator tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the iOS 18 simulator
        id: simulator
        uses: ./.github/actions/setup-ios-simulator

      # Scripts/ci-xcodebuild.sh writes an .xcresult and prints the failed tests at the end of the step's log.
      - name: Run package tests on the iOS 18 simulator
        run: |
          Scripts/ci-xcodebuild.sh package-ios test \
            -scheme EsplitealoCore-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload the test result bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-xcresults
          path: ${{ runner.temp }}/xcresults
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up build output
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/xcresults"

  # The Esplitéalo app (App/Esplitealo.xcodeproj): the whole test plan of the Esplitealo scheme on an iOS 18 simulator:
  # unit tests, snapshot tests (EsplitealoTests) and the UI smoke and flow tests (EsplitealoUITests).
  # Not in branch protection and gated on the required "macOS" job, so it can never make the required check slower or flakier.
  ios-app:
    name: iOS App
    runs-on: macos-26
    timeout-minutes: 40
    needs: macOS
    env:
      # Snapshot references are recorded on iOS 18.x; xcodebuild keeps its package checkouts in a cached folder.
      SOURCE_PACKAGES: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the iOS 18 simulator
        id: simulator
        uses: ./.github/actions/setup-ios-simulator

      # Only the downloaded packages are cached, under an exact key (the pinned versions in Package.resolved), so a
      # cache hit gives the same sources a cold run would fetch. Build output is never cached: every run builds from scratch.
      - name: Cache package checkouts (swift-snapshot-testing)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: ${{ runner.os }}-app-spm-${{ hashFiles('App/Esplitealo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Scripts/ci-xcodebuild.sh writes one .xcresult per step and prints the failed tests at the end of the step's log,
      # so `Scripts/ci-logs.sh` shows why a test failed without a simulator.
      - name: Build the app and its tests for the iOS Simulator (no signing)
        id: build
        run: |
          Scripts/ci-xcodebuild.sh app-build build-for-testing \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit and snapshot tests
        run: |
          Scripts/ci-xcodebuild.sh app-unit test-without-building \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -only-testing:EsplitealoTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      # Runs even when the unit tests failed, so one run reports every failure. Launching the app in a simulator is
      # the flakiest part of any iOS CI, so a failed UI test is retried once before it fails the job.
      - name: UI smoke and flow tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          Scripts/ci-xcodebuild.sh app-ui test-without-building \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -only-testing:EsplitealoUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      # The bundles hold the failure messages, the UI test screenshots and the snapshot diffs.
      - name: Upload the test result bundles
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app-xcresults
          path: ${{ runner.temp }}/xcresults
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up build output
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/xcresults"
          xcrun simctl shutdown all || true

  linux-core:
    name: Linux Core build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container: swift:6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only EsplitealoCore: the other targets import Apple-only frameworks.
      - name: Build EsplitealoCore (Foundation only)
        run: swift build --target EsplitealoCore

  # Informational: the Python reference calculator needs no Xcode, so it runs on the cheap Linux runner.
  # The Swift comparison with its committed corpus already runs in the required macOS job.
  reference-calculator:
    name: Reference calculator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reference tests and committed corpus check
        working-directory: Tools/reference-calculator
        run: |
          python3 -m unittest -v
          python3 generate_corpus.py --count 300 --check ../../Tests/Fixtures/CalculatorProof/reference-corpus-300.json

  vision-integration:
    name: Vision integration
    runs-on: macos-26
    timeout-minutes: 45
    needs: macOS
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Vision OCR integration tests
        run: swift test --filter ReceiptScannerVisionTests

  # The Release configuration (Archive, TestFlight, App Store) compiles code that Debug builds skip, for example #Preview
  # blocks that use DEBUG-only helpers. A device build with no signing keeps it from regressing. Same gating as iOS App.
  ios-release:
    name: iOS Release build
    runs-on: macos-26
    timeout-minutes: 25
    needs: macOS
    env:
      SOURCE_PACKAGES: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Build the app in Release for generic iOS (no signing)
        run: |
          Scripts/ci-xcodebuild.sh app-release build \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

  ios-capture:
    name: iOS Capture compile
    runs-on: macos-26
    timeout-minutes: 25
    needs: macOS
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Build EsplitealoCapture for iOS Simulator
        run: |
          xcodebuild build \
            -scheme EsplitealoCapture \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Scanner Lab for generic iOS (no signing)
        run: |
          xcodebuild build \
            -project Tools/ScannerLab/ScannerLab.xcodeproj \
            -scheme ScannerLab \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
