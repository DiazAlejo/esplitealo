name: Journey probe

# Runs a few journey tests on their own (about 10 minutes, not the full suite) and always uploads the result bundle.
# Start it from the Actions tab or `gh workflow run journey-probe.yml -f tests=JourneyLargeTextUITests`, or, from a branch
# that is not the default one, by changing .github/journey-probe.txt (one class or Class/method per line) and pushing.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Journey test classes or Class/method, separated by spaces
        required: true
        default: JourneyLargeTextUITests
  push:
    paths: [.github/journey-probe.txt]

permissions:
  contents: read

jobs:
  probe:
    name: Journey probe
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SOURCE_PACKAGES: ${{ github.workspace }}/.spm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the iOS 18 simulator
        id: simulator
        uses: ./.github/actions/setup-ios-simulator

      - name: Cache package checkouts (swift-snapshot-testing)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: ${{ runner.os }}-app-spm-${{ hashFiles('App/Esplitealo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build the app and its tests for the iOS Simulator (no signing)
        id: build
        run: |
          Scripts/ci-xcodebuild.sh app-build build-for-testing \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO

      - name: Journey tests
        run: |
          tests="${{ github.event.inputs.tests }}"
          if [ -z "$tests" ]; then tests="$(tr '\n' ' ' < .github/journey-probe.txt)"; fi
          only=()
          for t in $tests; do only+=("-only-testing:EsplitealoUITests/$t"); done
          Scripts/ci-xcodebuild.sh app-probe test-without-building \
            -project App/Esplitealo.xcodeproj \
            -scheme Esplitealo \
            "${only[@]}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload the test result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-probe-xcresults
          path: ${{ runner.temp }}/xcresults
          retention-days: 7
          if-no-files-found: ignore
